name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: false
      # The project sets python-downloads = "manual", so the interpreter is installed explicitly.
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q -rs
      - run: uv run --frozen python -m runner.demo
